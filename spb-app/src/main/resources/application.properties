spring.application.name=spb-app
# Server Port
server.port=8081

# Database Configuration
spring.datasource.url=${DB_HOST:jdbc:postgresql://localhost:5432/spb_db}
#spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:spb_user}
spring.datasource.password=${DB_PASSWORD:spb_user_pwd}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.sql.init.platform=h2
spring.sql.init.mode=always
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Enable H2 Console (accessible at http://localhost:8081/h2-console)
#spring.h2.console.enabled=true


# ⚠️ CRITICAL: Allow creation for this session
spring.h2.console.settings.remote-access=false
