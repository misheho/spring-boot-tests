version: '3.8'

services:
  # ┌───────────────────────────────────────┐
  # │ APPLICATION SERVICE                    │
  # └───────────────────────────────────────┘
  spb-app:
    build:
      context: .
    ports:
      - "8081:8081"
    environment:
      DB_HOST: jdbc:postgresql://db:5432/spb_db
      DB_USERNAME: spb_user
      DB_PASSWORD: spb_user_pwd
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ┌───────────────────────────────────────┐
  # │ API GATEWAY SERVICE            │
  # └───────────────────────────────────────┘
  api-gateway:
    build:
      context: ../../spring-cloud-api-gateway/api-gateway
    ports:
      - "8090:8090"
    depends_on:
      - spb-app
    restart: unless-stopped

  # ┌───────────────────────────────────────┐
  # │ POSTGRESQL DATABASE SERVICE            │
  # └───────────────────────────────────────┘
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spb_db
      POSTGRES_USER: spb_user
      POSTGRES_PASSWORD: spb_user_pwd
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spb_user -d spb_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
